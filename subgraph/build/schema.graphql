type Market @entity(immutable: false) {
  id: ID!
  marketId: BigInt!
  question: String!
  creator: Bytes!
  resolutionTime: BigInt!
  resolved: Boolean!
  winner: Int
  outcomeToken: Bytes!
  baseToken: Bytes!
  reserveYes: BigInt!
  reserveNo: BigInt!
  feeBps: Int!
  totalLpShares: BigInt!
  createdAt: BigInt!
}

type Trade @entity(immutable: true) {
  id: ID!
  market: Market!
  trader: Bytes!
  outcome: Int!
  amountIn: BigInt!
  amountOut: BigInt!
  timestamp: BigInt!
}

type LiquidityChange @entity(immutable: true) {
  id: ID!
  market: Market!
  provider: Bytes!
  amountYes: BigInt!
  amountNo: BigInt!
  shares: BigInt!
  isAdd: Boolean!
  timestamp: BigInt!
}

type Proposal @entity(immutable: false) {
  id: ID!
  proposalId: BigInt!
  description: String!
  proposer: Bytes!
  startBlock: BigInt!
  endBlock: BigInt!
  forVotes: BigInt!
  againstVotes: BigInt!
  abstainVotes: BigInt!
  executed: Boolean!
  createdAt: BigInt!
}
